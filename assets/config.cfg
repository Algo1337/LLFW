[@SETTINGS]
{
    protection: 1
    monitor: 1
    max_pps: 7500
    max_connections: 40
    max_con_per_ip: 2
    max_con_per_port: 2
    auto_reset_rules: true
    auto_add_rules: false
    discord_webhook_api: 
}

[@RULES]
{
    sudo iptables -A INPUT -p udp -j DROP
}

[@PROTECTED_IPS]
{
    1.1.1.1
}

// Add service ports in-use
// PORT / SERVICE_NAME / PROTOCOL / RESTART_COMMAND / MAX_CON / MAX_PPS / FILTER / DROP
//  80  ;    APACHE   ;   TCP     ;  RESTART_CMD    ;    3    ;   0     ;  true  ; true
[@SERVICES]
{
    80;APACHE;TCP;service apache2 restart;0;0;0;0
}